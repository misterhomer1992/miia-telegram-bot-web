<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subscription confirmed — Miia</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --ink: #050b1a;
    --bg: #0a1428;
    --bg-2: #0d1a35;
    --panel: #122444;
    --panel-2: #16294f;
    --line: #1f3868;
    --line-2: #284680;
    --text: #e8eef7;
    --text-2: #a9b8d4;
    --text-3: #6f82a8;
    --blue: #6bb6f0;
    --blue-2: #4a96d8;
    --blue-soft: rgba(107,182,240,.14);
    --amber: #f5a166;
    --amber-2: #e88a4a;
    --amber-soft: rgba(245,161,102,.14);
    --green: #4ade80;
    --green-soft: rgba(74,222,128,.14);

    --nav-bg: rgba(10,20,40,.62);
    --nav-border: rgba(31,56,104,.5);
    --grid-color: rgba(255,255,255,.025);
    --atmo-blue-1: rgba(107,182,240,.18);
    --atmo-amber-1: rgba(245,161,102,.14);
    --atmo-green-1: rgba(74,222,128,.10);
    --eyebrow-bg: rgba(18,36,68,.6);
    --cta-fill: var(--text);
    --cta-text: var(--ink);
    --card-grad-from: rgba(18,36,68,.5);
    --card-grad-to: rgba(13,26,53,.3);
    --shadow-strong: 0 40px 80px rgba(0,0,0,.45);
    --shadow-med: 0 20px 40px rgba(0,0,0,.45);
    --logo-ring: rgba(201,212,232,.4);
  }

  [data-theme="light"] {
    --ink: #ffffff;
    --bg: #f5f7fc;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-2: #f8fafd;
    --line: #e2e8f3;
    --line-2: #c4d0e4;
    --text: #0a1428;
    --text-2: #4a5a78;
    --text-3: #8896b3;
    --blue: #2876c4;
    --blue-2: #1c5ea3;
    --blue-soft: rgba(40,118,196,.10);
    --amber: #d97843;
    --amber-2: #b6562a;
    --amber-soft: rgba(217,120,67,.10);
    --green: #16a34a;
    --green-soft: rgba(22,163,74,.10);

    --nav-bg: rgba(255,255,255,.78);
    --nav-border: rgba(196,208,228,.7);
    --grid-color: rgba(10,20,40,.04);
    --atmo-blue-1: rgba(40,118,196,.10);
    --atmo-amber-1: rgba(217,120,67,.08);
    --atmo-green-1: rgba(22,163,74,.08);
    --eyebrow-bg: rgba(255,255,255,.7);
    --cta-fill: #0a1428;
    --cta-text: #ffffff;
    --card-grad-from: rgba(255,255,255,.9);
    --card-grad-to: rgba(245,247,252,.6);
    --shadow-strong: 0 30px 60px rgba(20,40,80,.12), 0 4px 12px rgba(20,40,80,.06);
    --shadow-med: 0 12px 28px rgba(20,40,80,.08);
    --logo-ring: rgba(74,90,120,.2);
  }

  html { transition: background-color .25s ease; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Space Grotesk", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex; flex-direction: column;
    transition: background-color .3s ease, color .3s ease;
  }
  .serif { font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--amber); color: var(--ink); }

  /* Background atmosphere (same as home + a hint of green) */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(900px 600px at 12% 18%, var(--atmo-blue-1), transparent 60%),
      radial-gradient(900px 600px at 92% 12%, var(--atmo-amber-1), transparent 60%),
      radial-gradient(1200px 800px at 50% 110%, var(--atmo-green-1), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid-color) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 64px 64px;
    background-position: -1px -1px;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Nav (shared with home page) ───────────────────────── */
  nav.top {
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(16px);
    background: var(--nav-bg);
    border-bottom: 1px solid var(--nav-border);
  }
  nav.top .inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    max-width: 1240px; margin: 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 50%;
    background-image: url('assets/miia-logo.jpg');
    background-size: cover; background-position: center;
    box-shadow: 0 0 0 1px var(--logo-ring), 0 8px 24px rgba(0,0,0,.4);
  }
  .brand-name { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
  .brand-name span { color: var(--text-3); font-weight: 400; }
  nav.top ul { display: flex; gap: 28px; list-style: none; margin: 0; padding: 0; font-size: 14.5px; color: var(--text-2); }
  nav.top ul a:hover { color: var(--text); }
  nav.top .nav-cta {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px;
    background: var(--cta-fill); color: var(--cta-text);
    border-radius: 999px;
    font-weight: 500; font-size: 14px;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  nav.top .nav-cta:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(107,182,240,.25); }

  .nav-right { display: flex; align-items: center; gap: 12px; }

  /* Theme toggle */
  .theme-toggle {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    background: var(--eyebrow-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text-2);
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    position: relative;
    overflow: hidden;
  }
  .theme-toggle:hover { border-color: var(--line-2); color: var(--text); }
  .theme-toggle svg {
    width: 18px; height: 18px;
    position: absolute;
    transition: transform .45s cubic-bezier(.5,1.5,.5,1), opacity .25s ease;
  }
  [data-theme="dark"] .theme-toggle .t-sun,
  :root:not([data-theme="light"]) .theme-toggle .t-sun { transform: translateY(-28px) rotate(-90deg); opacity: 0; }
  [data-theme="dark"] .theme-toggle .t-moon,
  :root:not([data-theme="light"]) .theme-toggle .t-moon { transform: translateY(0) rotate(0); opacity: 1; }
  [data-theme="light"] .theme-toggle .t-sun { transform: translateY(0) rotate(0); opacity: 1; }
  [data-theme="light"] .theme-toggle .t-moon { transform: translateY(28px) rotate(90deg); opacity: 0; }

  /* Language switcher */
  .lang { position: relative; }
  .lang-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: var(--eyebrow-bg);
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text-2);
    font-size: 13px;
    font-family: "JetBrains Mono", monospace;
    cursor: pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .lang-btn:hover { border-color: var(--line-2); color: var(--text); }
  .lang-btn .globe {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none;
    stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
  }
  .lang-btn .chev {
    width: 10px; height: 10px;
    stroke: currentColor; fill: none; stroke-width: 1.8;
    transition: transform .18s ease;
  }
  .lang.open .lang-btn .chev { transform: rotate(180deg); }
  .lang.open .lang-btn { border-color: var(--blue); color: var(--text); }

  .lang-menu {
    position: absolute;
    top: calc(100% + 8px); right: 0;
    background: var(--bg-2);
    backdrop-filter: blur(20px);
    border: 1px solid var(--line-2);
    border-radius: 14px;
    padding: 6px;
    min-width: 200px;
    box-shadow: var(--shadow-med);
    opacity: 0; visibility: hidden;
    transform: translateY(-6px);
    transition: opacity .18s ease, transform .18s ease, visibility .18s;
    z-index: 60;
  }
  .lang.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0); }
  .lang-menu::before {
    content: "";
    position: absolute;
    top: -6px; right: 22px;
    width: 10px; height: 10px;
    background: var(--bg-2);
    border-top: 1px solid var(--line-2);
    border-left: 1px solid var(--line-2);
    transform: rotate(45deg);
  }
  .lang-opt {
    display: flex; align-items: center; gap: 12px;
    width: 100%;
    padding: 10px 12px;
    border: none; background: transparent;
    color: var(--text);
    font-family: "Space Grotesk", sans-serif;
    font-size: 14px;
    text-align: left;
    border-radius: 10px;
    cursor: pointer;
    transition: background .12s ease;
  }
  .lang-opt:hover { background: var(--blue-soft); }
  .lang-opt.active { background: var(--blue-soft); color: var(--blue); }
  .lang-opt .flag {
    width: 22px; height: 16px;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08);
    flex-shrink: 0;
    display: flex; flex-direction: column;
  }
  .lang-opt .flag-en {
    background:
      linear-gradient(180deg, transparent 46%, #fff 46%, #fff 54%, transparent 54%),
      linear-gradient(90deg, transparent 38%, #fff 38%, #fff 62%, transparent 62%),
      #012169;
    position: relative;
  }
  .lang-opt .flag-en::before, .lang-opt .flag-en::after {
    content: ""; position: absolute; inset: 0;
  }
  .lang-opt .flag-en::before {
    background:
      linear-gradient(45deg, transparent 47%, #C8102E 47%, #C8102E 53%, transparent 53%);
  }
  .lang-opt .flag-uk { background: linear-gradient(180deg, #0057B7 50%, #FFD700 50%); }
  .lang-opt .flag-pl { background: linear-gradient(180deg, #fff 50%, #DC143C 50%); }
  .lang-opt .meta { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .lang-opt .name { font-size: 14px; font-weight: 500; }
  .lang-opt .native {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-3);
  }
  .lang-opt.active .native { color: var(--blue); opacity: .75; }
  .lang-opt .check {
    width: 14px; height: 14px;
    stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
    opacity: 0;
  }
  .lang-opt.active .check { opacity: 1; }

  /* Mobile nav (mirror home page) */
  @media (max-width: 760px) {
    nav.top ul { display: none; }
    .lang-opt .native { display: none; }
    nav.top .inner { padding: 14px 20px; }
    .nav-right { gap: 8px; }
    .brand { gap: 10px; }
    .brand-name { font-size: 17px; }
    .brand-name span { display: none; }
    nav.top .nav-cta { padding: 9px 14px; }
  }
  @media (max-width: 540px) {
    .lang-btn { padding: 8px 10px; gap: 6px; }
    .lang-btn .label { display: none; }
    .lang-btn .chev { display: none; }
    .theme-toggle { width: 36px; height: 36px; }
    nav.top .nav-cta { padding: 0; width: 36px; height: 36px; justify-content: center; border-radius: 50%; gap: 0; }
    nav.top .nav-cta span { display: none; }
    nav.top .nav-cta svg { width: 16px; height: 16px; }
    nav.top .inner { padding: 12px 16px; }
    .brand-mark { width: 32px; height: 32px; }
  }
  @media (max-width: 360px) {
    .nav-right { gap: 6px; }
    .theme-toggle { width: 34px; height: 34px; }
    nav.top .nav-cta { width: 34px; height: 34px; }
    .lang-btn { padding: 7px 9px; }
  }

  /* ─── Page body: centered card ─────────────────────────── */
  main {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 56px 24px;
    position: relative;
    z-index: 1;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 520px;
    border: 1px solid var(--line-2);
    border-radius: 28px;
    padding: 56px 48px 48px;
    background: linear-gradient(180deg, var(--card-grad-from) 0%, var(--card-grad-to) 100%);
    backdrop-filter: blur(16px);
    box-shadow: var(--shadow-strong);
    text-align: center;
    overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), var(--blue), var(--amber), transparent);
    opacity: .6;
  }

  /* Check */
  .check-ring {
    width: 88px; height: 88px;
    margin: 0 auto 28px;
    border-radius: 50%;
    background: var(--green-soft);
    display: grid; place-items: center;
    position: relative;
    animation: ringPop .55s cubic-bezier(.2,1.4,.4,1) both;
  }
  .check-ring::before {
    content: "";
    position: absolute; inset: -8px;
    border-radius: 50%;
    border: 1px solid var(--green);
    opacity: .3;
    animation: ringExpand 2.8s ease-out infinite;
  }
  .check-ring::after {
    content: "";
    position: absolute; inset: -2px;
    border-radius: 50%;
    border: 1.5px solid var(--green);
    opacity: .55;
  }
  @keyframes ringPop {
    0% { transform: scale(.3); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes ringExpand {
    0% { transform: scale(.85); opacity: .5; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  .check-svg {
    width: 40px; height: 40px;
    stroke: var(--green); fill: none;
    stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  }
  .check-svg path {
    stroke-dasharray: 28;
    stroke-dashoffset: 28;
    animation: checkDraw .55s .35s ease forwards;
  }
  @keyframes checkDraw { to { stroke-dashoffset: 0; } }

  h1 {
    font-size: clamp(32px, 4.4vw, 44px);
    line-height: 1.1;
    letter-spacing: -.025em;
    font-weight: 500;
    margin: 0 0 14px;
  }
  h1 .serif { color: var(--green); }

  p.sub {
    margin: 0 0 36px;
    color: var(--text-2);
    font-size: 17px;
    line-height: 1.55;
    max-width: 38ch;
    margin-left: auto;
    margin-right: auto;
  }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px;
    border-radius: 999px;
    font-weight: 500; font-size: 16px;
    background: linear-gradient(135deg, var(--blue) 0%, var(--amber) 110%);
    color: #0a1428;
    border: none;
    position: relative;
    box-shadow: 0 12px 28px rgba(107,182,240,.25), 0 4px 10px rgba(245,161,102,.18);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-primary::before {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255,255,255,.4), transparent 60%);
    opacity: 0; transition: opacity .2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(107,182,240,.32), 0 8px 16px rgba(245,161,102,.22); }
  .btn-primary:hover::before { opacity: 1; }
  .btn-primary svg {
    width: 18px; height: 18px;
    stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }

  .hint {
    margin-top: 22px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11.5px;
    color: var(--text-3);
    letter-spacing: .08em;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
    justify-content: center;
  }
  .hint::before, .hint::after {
    content: "";
    width: 24px; height: 1px;
    background: var(--line-2);
  }

  @media (max-width: 540px) {
    main { padding: 32px 16px; }
    .card { padding: 44px 28px 36px; border-radius: 22px; }
    h1 { font-size: 30px; }
    p.sub { font-size: 16px; }
    .btn-primary { padding: 14px 22px; font-size: 15px; }
  }

  /* small inline icon */
  .ic { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .ic-sm { width: 14px; height: 14px; }
</style>
</head>
<body>

<nav class="top">
  <div class="inner">
    <a href="Miia Site.html" class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-name">Miia <span data-i18n="nav.tag">/ AI for Telegram</span></div>
    </a>
    <ul>
      <li><a href="Miia Site.html#capabilities" data-i18n="nav.capabilities">Capabilities</a></li>
      <li><a href="Miia Site.html#how" data-i18n="nav.how">How it works</a></li>
      <li><a href="Miia Site.html#support" data-i18n="nav.support">Support</a></li>
    </ul>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme">
        <svg class="t-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"></path>
        </svg>
        <svg class="t-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.5A8.5 8.5 0 119.5 3.5a7 7 0 0011 11z"></path>
        </svg>
      </button>
      <div class="lang" id="langSwitch">
        <button class="lang-btn" type="button" aria-haspopup="true" aria-expanded="false">
          <svg class="globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path></svg>
          <span class="label" id="langLabel">EN</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
        <div class="lang-menu" role="menu">
          <button class="lang-opt" data-lang="en" role="menuitem">
            <div class="flag flag-en"></div>
            <div class="meta"><span class="name">English</span><span class="native">EN · default</span></div>
            <svg class="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg>
          </button>
          <button class="lang-opt" data-lang="uk" role="menuitem">
            <div class="flag flag-uk"></div>
            <div class="meta"><span class="name">Українська</span><span class="native">UK · Ukrainian</span></div>
            <svg class="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg>
          </button>
          <button class="lang-opt" data-lang="pl" role="menuitem">
            <div class="flag flag-pl"></div>
            <div class="meta"><span class="name">Polski</span><span class="native">PL · Polish</span></div>
            <svg class="check" viewBox="0 0 24 24"><path d="M5 12l5 5 9-11"></path></svg>
          </button>
        </div>
      </div>
      <a href="https://t.me/" class="nav-cta">
        <span data-i18n="nav.cta">Open in Telegram</span>
        <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"></path></svg>
      </a>
    </div>
  </div>
</nav>

<main>
  <div class="card">
    <div class="check-ring" aria-hidden="true">
      <svg class="check-svg" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </div>

    <h1 data-i18n-html="title">
      Payment <span class="serif">received</span>.
    </h1>
    <p class="sub" data-i18n="sub">
      Your subscription is active. You can close this window and head back to the Miia bot in Telegram — everything's already unlocked.
    </p>

    <a href="https://t.me/" class="btn-primary">
      <svg viewBox="0 0 24 24"><path d="M22 3L2 11l7 3 2 7 4-5 6 5 1-18z"></path></svg>
      <span data-i18n="cta">Open Miia in Telegram</span>
    </a>

    <div class="hint" data-i18n="hint">Safe to close this tab</div>
  </div>
</main>

<script>
  // ─── Theme (synced with main site) ─
  const THEME_KEY = "miia.theme";
  const root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute("data-theme", t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }
  let storedTheme = "dark";
  try { storedTheme = localStorage.getItem(THEME_KEY) || "dark"; } catch (e) {}
  applyTheme(storedTheme === "light" ? "light" : "dark");
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = root.getAttribute("data-theme") === "light" ? "light" : "dark";
    applyTheme(cur === "light" ? "dark" : "light");
  });

  // ─── i18n (synced with main site) ─
  const I18N = {
    en: {
      "nav.tag": "/ AI for Telegram",
      "nav.capabilities": "Capabilities",
      "nav.how": "How it works",
      "nav.support": "Support",
      "nav.cta": "Open in Telegram",

  };

  const LANG_LABELS = { en: "EN", uk: "UK", pl: "PL" };
  const LANG_KEY = "miia.lang";

  function applyLang(lang) {
    const dict = I18N[lang] || I18N.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (dict[key] !== undefined) el.textContent = dict[key];
    });
    document.querySelectorAll("[data-i18n-html]").forEach(el => {
      const key = el.getAttribute("data-i18n-html");
      if (dict[key] !== undefined) el.innerHTML = dict[key];
    });
    document.documentElement.lang = lang;
    document.getElementById("langLabel").textContent = LANG_LABELS[lang] || "EN";
    document.querySelectorAll(".lang-opt").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === lang);
    });
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
  }

  // wire up switcher
  const langEl = document.getElementById("langSwitch");
  const langBtn = langEl.querySelector(".lang-btn");
  langBtn.addEventListener("click", e => {
    e.stopPropagation();
    const open = langEl.classList.toggle("open");
    langBtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", e => {
    if (!langEl.contains(e.target)) {
      langEl.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    }
  });
  document.querySelectorAll(".lang-opt").forEach(opt => {
    opt.addEventListener("click", () => {
      applyLang(opt.dataset.lang);
      langEl.classList.remove("open");
      langBtn.setAttribute("aria-expanded", "false");
    });
  });

  // initial language: stored > browser > default en
  let initial = "en";
  try { initial = localStorage.getItem(LANG_KEY) || initial; } catch (e) {}
  if (!I18N[initial]) {
    const nav = (navigator.language || "en").toLowerCase();
    if (nav.startsWith("uk")) initial = "uk";
    else if (nav.startsWith("pl")) initial = "pl";
    else initial = "en";
  }
  applyLang(initial);
</script>
